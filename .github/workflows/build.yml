name: Build Langan Explorer for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja pyinstaller==6.16.0

      - name: Install llama.cpp Python package
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: |
          python -m pip install --no-cache-dir llama-cpp-python==0.3.16

      - name: Download SmolLM2 GGUF model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $modelUrl = "https://huggingface.co/tensorblock/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q5_0.gguf"
          Invoke-WebRequest -Uri $modelUrl -OutFile "models/SmolLM2-360M-Instruct-Q5_0.gguf"
          if ((Get-Item "models/SmolLM2-360M-Instruct-Q5_0.gguf").Length -lt 100000000) {
            throw "The model download looks incomplete."
          }

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name LanganExplorer `
            --collect-all llama_cpp `
            --add-data "models;models" `
            langan_desktop.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LanganExplorer-Windows-EXE
          path: dist/LanganExplorer.exe
          if-no-files-found: error
