name: Build Langan Explorer for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja pyinstaller==6.16.0 huggingface_hub

      - name: Install llama.cpp Python package
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: |
          python -m pip install --no-cache-dir llama-cpp-python==0.3.16

      - name: Download and verify SmolLM2 GGUF model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          hf download tensorblock/SmolLM2-360M-Instruct-GGUF SmolLM2-360M-Instruct-Q4_K_M.gguf --local-dir models
          $model = "models/SmolLM2-360M-Instruct-Q4_K_M.gguf"
          if (!(Test-Path $model)) {
            throw "Model download failed: expected model file was not created."
          }
          $size = (Get-Item $model).Length
          if ($size -lt 200000000) {
            throw "Model download looks incomplete. File size: $size bytes"
          }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $model))
          try {
            $magic = New-Object byte[] 4
            [void]$stream.Read($magic, 0, 4)
          } finally {
            $stream.Dispose()
          }
          $signature = [System.BitConverter]::ToString($magic)
          if ($signature -ne "47-47-55-46") {
            throw "Downloaded file is not a GGUF model. Signature: $signature"
          }

      - name: Update app to use Q4_K_M model
        shell: pwsh
        run: |
          $source = Get-Content "langan_desktop.py" -Raw
          $oldName = "SmolLM2-360M-Instruct-Q5_0.gguf"
          $newName = "SmolLM2-360M-Instruct-Q4_K_M.gguf"
          if (!$source.Contains($oldName)) {
            throw "Expected model filename was not found in langan_desktop.py."
          }
          $updated = $source.Replace($oldName, $newName)
          Set-Content -Path "langan_desktop.py" -Value $updated -NoNewline

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name LanganExplorer `
            --collect-all llama_cpp `
            --add-data "models;models" `
            langan_desktop.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LanganExplorer-Windows-EXE
          path: dist/LanganExplorer.exe
          if-no-files-found: error
